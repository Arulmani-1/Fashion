<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - 404</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { black: '#111111', offwhite: '#F6F5F2', softgray: '#E9E7E2', darkgray: '#444444', accent: '#7f2a4f' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-black antialiased overflow-hidden">
    <div class="page-transition"></div>

    <main class="h-screen flex items-center justify-center relative px-6">
        <div class="relative z-10 text-center max-w-2xl mx-auto error-content">
            <h1 class="text-[8rem] md:text-[12rem] leading-none display-font bg-gradient-to-r from-accent via-pink-500 to-orange-400 text-transparent bg-clip-text mb-4 floating-404 inline-block">404</h1>
            <h2 class="text-3xl md:text-5xl display-font mb-6 leading-tight">Looks like this page changed its outfit.</h2>
            <p class="text-lg text-gray-600 font-light mb-10">The page you're looking for is no longer here, or has been moved to a new collection.</p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="index.html" class="btn-stackly">Back to Home</a>
                <button onclick="window.history.back()" class="btn-stackly bg-transparent border-black text-black hover:bg-black hover:text-white">Go Back</button>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.error-content > *', {
                y: 30, opacity: 0, duration: 0.8, stagger: 0.15, ease: 'power3.out', delay: 0.3
            });
            
            // Floating animation for 404 text
            gsap.to('.floating-404', {
                y: -30,
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });
        });
    </script>
</body>
</html>
