<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - Checkout</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { black: '#111111', offwhite: '#F6F5F2', softgray: '#E9E7E2', darkgray: '#444444', accent: '#7f2a4f' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-black antialiased">
    <div class="page-transition"></div>
    <header id="navbar-container" class="w-full transition-all duration-300"></header>

    <main>
        <section class="pt-32 pb-16 px-6 max-w-screen-xl mx-auto text-center">
            <h1 class="text-5xl md:text-7xl display-font mb-6">Checkout</h1>
            <p class="text-lg text-gray-600 font-light">Complete your purchase.</p>
        </section>

        <section class="px-6 md:px-12 max-w-screen-2xl mx-auto mb-24 flex flex-col lg:flex-row gap-12">
            
            <!-- Checkout Form -->
            <div class="w-full lg:w-2/3">
                <form>
                    <div class="mb-12">
                        <h3 class="text-xl uppercase tracking-widest font-bold mb-6 border-b border-gray-200 pb-4">Contact Information</h3>
                        <div class="mb-4">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Email address *</label>
                            <input type="email" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition" placeholder="Email">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="newsletter" class="accent-black">
                            <label for="newsletter" class="text-sm text-gray-600">Email me with news and offers</label>
                        </div>
                    </div>

                    <div class="mb-12">
                        <h3 class="text-xl uppercase tracking-widest font-bold mb-6 border-b border-gray-200 pb-4">Shipping Address</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">First name *</label>
                                <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition" placeholder="First Name">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Last name *</label>
                                <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition" placeholder="Last Name">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Company name (optional)</label>
                            <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition">
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Country / Region *</label>
                            <select class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition">
                                <option>United States (US)</option>
                                <option>United Kingdom (UK)</option>
                                <option>Canada</option>
                                <option>Australia</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Street address *</label>
                            <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition mb-2" placeholder="House number and street name">
                            <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition" placeholder="Apartment, suite, unit, etc. (optional)">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <div class="col-span-1">
                                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Town / City *</label>
                                <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition">
                            </div>
                            <div class="col-span-1">
                                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">State *</label>
                                <select class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition">
                                    <option>New York</option>
                                    <option>California</option>
                                    <option>Texas</option>
                                </select>
                            </div>
                            <div class="col-span-1">
                                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">ZIP *</label>
                                <input type="text" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Phone *</label>
                            <input type="tel" class="w-full border border-gray-300 bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-black transition">
                        </div>
                    </div>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="w-full lg:w-1/3">
                <div class="bg-white border border-gray-200 p-8 sticky top-24">
                    <h3 class="text-lg uppercase tracking-widest font-bold mb-6 border-b border-gray-200 pb-4">Your Order</h3>
                    
                    <div class="space-y-4 mb-6 pb-6 border-b border-gray-200">
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-4">
                                <img src="assets/images/img_4f427ab8.webp" alt="Ribbed Silk Top" class="w-12 h-16 object-cover bg-gray-100">
                                <div>
                                    <p class="font-medium">Ribbed Silk Top <span class="text-gray-400 font-light">x 1</span></p>
                                    <p class="text-xs text-gray-500 uppercase">Size: S</p>
                                </div>
                            </div>
                            <span class="font-medium">$120.00</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-4">
                                <img src="assets/images/img_ceda2cc5.webp" alt="Linen Wide-Leg Pants" class="w-12 h-16 object-cover bg-gray-100">
                                <div>
                                    <p class="font-medium">Linen Wide-Leg Pants <span class="text-gray-400 font-light">x 2</span></p>
                                    <p class="text-xs text-gray-500 uppercase">Size: M</p>
                                </div>
                            </div>
                            <span class="font-medium">$370.00</span>
                        </div>
                    </div>

                    <div class="flex justify-between mb-4 text-sm">
                        <span class="text-gray-500 font-light">Subtotal</span>
                        <span class="font-medium">$490.00</span>
                    </div>
                    
                    <div class="flex justify-between mb-6 pb-6 border-b border-gray-200 text-sm">
                        <span class="text-gray-500 font-light">Shipping</span>
                        <div class="text-right">
                            <span class="block mb-1">Standard Delivery: $15.00</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between mb-8 text-lg font-bold">
                        <span>Total</span>
                        <span>$505.00</span>
                    </div>
                    
                    <a href="payment.html" class="btn-stackly w-full block text-center">Continue to Payment</a>
                </div>
            </div>

        </section>
    </main>

    <footer id="footer-container" class="w-full mt-auto"></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
