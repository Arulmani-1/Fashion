<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stackly - Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { black: '#111111', offwhite: '#F6F5F2', softgray: '#E9E7E2', darkgray: '#444444', accent: '#7f2a4f' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="bg-offwhite text-black antialiased overflow-hidden">
<div class="page-transition"></div>
<main class="flex h-screen w-full relative">
<!-- Left Image / Mobile Background -->
<div class="absolute inset-0 lg:static lg:flex lg:w-1/2 relative bg-black items-center justify-center overflow-hidden z-0">
<img alt="Login Banner" class="absolute inset-0 w-full h-full object-cover opacity-60 lg:opacity-80" src="assets/images/login_banner.webp"/>
<div class="relative z-10 text-white text-center hidden lg:block">
<h1 class="text-6xl display-font mb-4">Welcome to Stackly</h1>
<p class="font-light tracking-widest uppercase text-sm">Sign in to explore your curated world.</p>
</div>
<!-- Back to home overlay link -->
<a class="absolute top-8 left-8 text-white uppercase text-xs tracking-widest font-semibold hover:text-accent transition z-20" href="index.html">
<i class="fas fa-arrow-left mr-2"></i> Back to Home
            </a>
</div>
<!-- Right Form -->
<div class="w-full lg:w-1/2 relative z-10 flex items-center justify-center p-8 bg-white/85 lg:bg-offwhite backdrop-blur-md lg:backdrop-blur-none overflow-y-auto h-screen shadow-xl lg:shadow-none">
<div class="w-full max-w-md stagger-form my-auto pb-10 pt-10">
<div class="text-center mb-10 flex justify-center">
    <a href="index.html" class="inline-block hover:opacity-75 transition-opacity">
        <img src="assets/images/logo.webp" alt="Stackly Logo" class="h-8 md:h-10 w-auto object-contain">
    </a>
</div>
<h2 class="text-3xl display-font mb-8">Login</h2>
<form id="login-form" class="space-y-6">
<!-- Role Selection -->
<div class="flex items-center space-x-6 py-2">
    <label class="flex items-center text-gray-700 cursor-pointer font-medium text-sm">
        <input type="radio" name="role" value="client" checked class="mr-2 accent-[#7f2a4f] w-4 h-4">
        Client
    </label>
    <label class="flex items-center text-gray-700 cursor-pointer font-medium text-sm">
        <input type="radio" name="role" value="admin" class="mr-2 accent-[#7f2a4f] w-4 h-4">
        Admin
    </label>
</div>

<div>
<input id="login-email" class="form-control" placeholder="Email Address" required="" type="email"/>
</div>
<div>
<input class="form-control" placeholder="Password" required="" type="password"/>
</div>


<div class="flex items-center justify-between text-sm">
<label class="flex items-center text-gray-600 cursor-pointer">
<input class="mr-2 accent-black" type="checkbox"/> Remember Me
                        </label>
<a class="text-black hover:text-accent transition border-b border-black hover:border-accent" href="#">Forgot Password?</a>
</div>
<button class="btn-stackly w-full py-4 mt-4" type="submit">Login</button>
</form>
<div class="mt-8">
<div class="relative flex py-5 items-center">
<div class="flex-grow border-t border-gray-300"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 text-sm">or sign in with</span>
<div class="flex-grow border-t border-gray-300"></div>
</div>
<div class="flex space-x-4">
<button class="flex-1 py-3 border border-gray-300 hover:border-black transition flex items-center justify-center text-sm font-semibold">
<i class="fab fa-google mr-2"></i> Google
                        </button>
<button class="flex-1 py-3 border border-gray-300 hover:border-black transition flex items-center justify-center text-sm font-semibold">
<i class="fab fa-apple mr-2 text-lg"></i> Apple
                        </button>
</div>
</div>
<p class="text-center mt-8 text-sm text-gray-600">
                    Don't have an account? <a class="text-black font-semibold uppercase tracking-wide border-b border-black" href="signup.html">Sign Up</a>
</p>
</div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="js/main.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.stagger-form > *', {
                y: 30, opacity: 0, duration: 0.6, stagger: 0.1, ease: 'power2.out', delay: 0.2
            });

            // Handle Login Form Submission
            const loginForm = document.getElementById('login-form');
            if(loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('login-email').value;
                    const role = document.querySelector('input[name="role"]:checked').value;
                    
                    // Store email in sessionStorage to display on the dashboard
                    sessionStorage.setItem('stackly_user_email', email);
                    
                    // Redirect based on role
                    if (role === 'admin') {
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        window.location.href = 'client_dashboard.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
